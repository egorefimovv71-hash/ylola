<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D аквариум на столе</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1512; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    color: rgba(255,240,220,0.7); font-size: 14px; pointer-events: none;
    background: rgba(0,0,0,0.35); padding: 6px 14px; border-radius: 12px;

  }
  #ui { position: fixed; top: 14px; right: 14px; display: flex; gap: 8px; }
  #ui button {
    background: rgba(20,30,40,0.7); color: #e8f7ff; border: 1px solid rgba(160,230,255,0.4);
    border-radius: 10px; padding: 8px 14px; font-size: 14px; cursor: pointer;
  }
  #ui button:hover { background: rgba(40,70,90,0.8); }
</style>
</head>
<body>
<div id="ui">
  <button id="waveBtn">Волны: вкл</button>
</div>
<div id="hint">Тяни мышью — вращать · колесо — приблизить · тяни телефон — двигать · R — повернуть · клик по аквариуму — корм и волна</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================= renderer / scene =================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
 
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1512);
scene.fog = new THREE.Fog(0x1b1512, 14, 26);
 
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
 
const rnd = (a, b) => a + Math.random() * (b - a);
 
// ================= свет =================
scene.add(new THREE.AmbientLight(0xffffff, 0.45));
const sun = new THREE.DirectionalLight(0xfff1dc, 1.1);
sun.position.set(4, 8, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -6; sun.shadow.camera.right = 6;
sun.shadow.camera.top = 6; sun.shadow.camera.bottom = -6;
sun.shadow.bias = -0.0005;
scene.add(sun);
 
const tankLight = new THREE.PointLight(0x5fd4ff, 1.0, 6, 2);
tankLight.position.set(0, 1.5, 0.6);
scene.add(tankLight);
 
// ================= пол и стол =================
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color: 0x2a2220, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -2.2;
floor.receiveShadow = true;
scene.add(floor);
 
const woodMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.55, metalness: 0.05 });
const tableTop = new THREE.Mesh(new THREE.BoxGeometry(8, 0.25, 4.2), woodMat);
tableTop.position.set(0, -0.125, 0);
tableTop.castShadow = true;
tableTop.receiveShadow = true;
scene.add(tableTop);
 
const legGeo = new THREE.BoxGeometry(0.25, 2.2, 0.25);
for (const [x, z] of [[-3.7, -1.85], [3.7, -1.85], [-3.7, 1.85], [3.7, 1.85]]) {
  const leg = new THREE.Mesh(legGeo, woodMat);
  leg.position.set(x, -1.1, z);
  leg.castShadow = true;
  scene.add(leg);
}
 
// ================= аквариум =================
const TANK_W = 4, TANK_H = 2.2, TANK_D = 2;
const WATER_W = TANK_W - 0.05, WATER_D = TANK_D - 0.05;
const WATER_BOTTOM = 0.1;
const WATER_HEIGHT = 1.85;
const SURF_Y = WATER_BOTTOM + WATER_HEIGHT;
 
const tank = new THREE.Group();
scene.add(tank);
 
const stand = new THREE.Mesh(
  new THREE.BoxGeometry(TANK_W + 0.1, 0.1, TANK_D + 0.1),
  new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.4, metalness: 0.3 })
);
stand.position.set(0, 0.05, 0);
stand.castShadow = true;
tank.add(stand);
 
const waterVolumeMat = new THREE.ShaderMaterial({
  uniforms: {
    uDeep:    { value: new THREE.Color(0x0a4a66) },
    uShallow: { value: new THREE.Color(0x46c8e6) },
    uBot:     { value: WATER_BOTTOM },
    uTop:     { value: SURF_Y },
  },
  vertexShader: `
    varying float vY;
    varying vec3 vNormalW;
    varying vec3 vViewDir;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vY = wp.y;
      vNormalW = normalize(mat3(modelMatrix) * normal);
      vViewDir = normalize(cameraPosition - wp.xyz);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 uDeep;
    uniform vec3 uShallow;
    uniform float uBot;
    uniform float uTop;
    varying float vY;
    varying vec3 vNormalW;
    varying vec3 vViewDir;
    void main() {
      float h = clamp((vY - uBot) / (uTop - uBot), 0.0, 1.0);
      vec3 col = mix(uDeep, uShallow, h);
      float fres = pow(1.0 - max(dot(normalize(vNormalW), normalize(vViewDir)), 0.0), 3.0);
      float alpha = mix(0.38, 0.14, h) + fres * 0.25;
      col += fres * vec3(0.25, 0.4, 0.45);
      gl_FragColor = vec4(col, alpha);
    }
  `,
  transparent: true,
  depthWrite: false,
  side: THREE.FrontSide,
});
const waterVolume = new THREE.Mesh(new THREE.BoxGeometry(WATER_W, WATER_HEIGHT, WATER_D), waterVolumeMat);
waterVolume.position.set(0, WATER_BOTTOM + WATER_HEIGHT / 2, 0);
tank.add(waterVolume);
 
const glass = new THREE.Mesh(
  new THREE.BoxGeometry(TANK_W, TANK_H, TANK_D),
  new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.08, roughness: 0.05, depthWrite: false })
);
glass.position.set(0, TANK_H / 2 + 0.1, 0);
tank.add(glass);
const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(glass.geometry),
  new THREE.LineBasicMaterial({ color: 0x9ff5d0, transparent: true, opacity: 0.6 })
);
edges.position.copy(glass.position);
tank.add(edges);
 
// ================= песок =================
const sandGeo = new THREE.PlaneGeometry(WATER_W, WATER_D, 40, 20);
sandGeo.rotateX(-Math.PI / 2);
{
  const pos = sandGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, Math.sin(x * 2.1) * 0.012 + Math.cos(z * 3.3) * 0.012 + Math.random() * 0.006);
  }
  sandGeo.computeVertexNormals();
}
const sand = new THREE.Mesh(sandGeo, new THREE.MeshStandardMaterial({ color: 0xd8b57a, roughness: 1 }));
sand.position.y = WATER_BOTTOM;
sand.receiveShadow = true;
tank.add(sand);
 
const causticMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    varying vec3 vW;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vW = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec3 vW;
    void main() {
      vec2 uv = vW.xz * 0.8;
      vec2 p = mod(uv * 6.2832, 6.2832) - 250.0;
      vec2 i = p;
      float c = 1.0;
      float inten = 0.005;
      for (int n = 0; n < 5; n++) {
        float t = uTime * 0.5 * (1.0 - (3.5 / float(n + 1)));
        i = p + vec2(cos(t - i.x) + sin(t + i.y), sin(t - i.y) + cos(t + i.x));
        c += 1.0 / length(vec2(p.x / (sin(i.x + t) / inten), p.y / (cos(i.y + t) / inten)));
      }
      c /= 5.0;
      c = 1.17 - pow(c, 1.4);
      float v = pow(abs(c), 8.0);
      gl_FragColor = vec4(vec3(v) * vec3(0.4, 0.85, 1.0) * 0.6, 1.0);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});
const caustics = new THREE.Mesh(new THREE.PlaneGeometry(WATER_W, WATER_D), causticMat);
caustics.rotation.x = -Math.PI / 2;
caustics.position.y = WATER_BOTTOM + 0.04;
tank.add(caustics);
 
// ================= камни =================
const stoneMat = new THREE.MeshStandardMaterial({ color: 0x6b6f73, roughness: 0.9, flatShading: true });
for (let i = 0; i < 7; i++) {
  const r = 0.15 + Math.random() * 0.25;
  const stone = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0), stoneMat);
  stone.scale.set(1, 0.6 + Math.random() * 0.4, 1 + Math.random() * 0.3);
  stone.position.set(-1.6 + Math.random() * 3.2, WATER_BOTTOM + r * 0.3, -0.7 + Math.random() * 1.4);
  stone.rotation.set(Math.random(), Math.random() * 3, Math.random());
  stone.castShadow = true;
  stone.receiveShadow = true;
  tank.add(stone);
}
 
// ================= растения в аквариуме =================
const plantMats = [
  new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.6, side: THREE.DoubleSide }),
  new THREE.MeshStandardMaterial({ color: 0x3aa56b, roughness: 0.6, side: THREE.DoubleSide }),
  new THREE.MeshStandardMaterial({ color: 0x5a3e8a, roughness: 0.6, side: THREE.DoubleSide }),
];
const plants = [];
function makePlant(x, z, height, matIdx) {
  const group = new THREE.Group();
  group.position.set(x, WATER_BOTTOM, z);
  const leaves = 5 + Math.floor(Math.random() * 4);
  for (let l = 0; l < leaves; l++) {
    const angle = (l / leaves) * Math.PI * 2 + Math.random() * 0.4;
    const h = height * (0.6 + Math.random() * 0.4);
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(Math.cos(angle) * 0.05, h * 0.4, Math.sin(angle) * 0.05),
      new THREE.Vector3(Math.cos(angle) * 0.14, h * 0.8, Math.sin(angle) * 0.14),
      new THREE.Vector3(Math.cos(angle) * 0.08, h, Math.sin(angle) * 0.08),
    ]);
    const blade = new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.035, 5, false), plantMats[matIdx]);
    blade.castShadow = true;
    group.add(blade);
  }
  tank.add(group);
  plants.push(group);
}
makePlant(-1.7, -0.5, 1.1, 0);
makePlant(-1.4, -0.7, 0.8, 1);
makePlant(1.6, -0.4, 1.3, 1);
makePlant(1.8, 0.5, 0.9, 2);
makePlant(0.3, -0.8, 0.7, 0);
 
// ================= поверхность с волнами =================
const SURF_SEG_X = 110, SURF_SEG_Z = 55;
const surfGeo = new THREE.PlaneGeometry(WATER_W, WATER_D, SURF_SEG_X, SURF_SEG_Z);
surfGeo.rotateX(-Math.PI / 2);
const surfBaseX = new Float32Array(surfGeo.attributes.position.count);
const surfBaseZ = new Float32Array(surfGeo.attributes.position.count);
for (let i = 0; i < surfBaseX.length; i++) {
  surfBaseX[i] = surfGeo.attributes.position.getX(i);
  surfBaseZ[i] = surfGeo.attributes.position.getZ(i);
}
const surface = new THREE.Mesh(surfGeo, new THREE.MeshPhongMaterial({
  color: 0x9fe6ff, transparent: true, opacity: 0.4,
  shininess: 160, specular: 0xffffff, side: THREE.DoubleSide, depthWrite: false,
}));
surface.position.y = SURF_Y;
tank.add(surface);
 
const ripples = [];
const MAX_RIPPLES = 40;
function addRipple(x, z, amp) {
  ripples.push({ x, z, t0: time, amp });
  if (ripples.length > MAX_RIPPLES) ripples.shift();
}
 
let wavesOn = true;
let time = 0;
 
function updateSurface() {
  const pos = surfGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = surfBaseX[i], z = surfBaseZ[i];
    let h = 0;
    if (wavesOn) {
      h += 0.010 * Math.sin(x * 5.0 + time * 1.3) + 0.008 * Math.sin(z * 7.0 - time * 1.7)
         + 0.006 * Math.sin((x + z) * 9.0 + time * 2.1);
      for (let r = 0; r < ripples.length; r++) {
        const rp = ripples[r];
        const age = time - rp.t0;
        if (age < 0 || age > 6) continue;
        const dx = x - rp.x, dz = z - rp.z;
        const d = Math.sqrt(dx * dx + dz * dz);
        const diff = d - age * 1.3;
        h += rp.amp * Math.sin(diff * 16) * Math.exp(-diff * diff * 12) * Math.exp(-age * 0.7);
      }
    }
    pos.setY(i, h);
  }
  pos.needsUpdate = true;
  surfGeo.computeVertexNormals();
}
 
// ================= текстуры рыб =================
function drawScales(g, alpha) {
  g.strokeStyle = `rgba(0,0,0,${alpha})`;
  g.lineWidth = 1;
  for (let y = 0; y < 128; y += 6) {
    for (let x = (y / 6) % 2 === 0 ? 0 : 5; x < 256; x += 10) {
      g.beginPath();
      g.arc(x, y, 5, 0.2 * Math.PI, 0.8 * Math.PI);
      g.stroke();
    }
  }
}
 
function makeBodyTexture(kind) {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 128;
  const g = cv.getContext('2d');
  switch (kind) {
    case 'angel': {
      const gr = g.createLinearGradient(0, 0, 0, 128);
      gr.addColorStop(0, '#c8d3d9'); gr.addColorStop(0.5, '#eef3f5'); gr.addColorStop(1, '#b9c4ca');
      g.fillStyle = gr; g.fillRect(0, 0, 256, 128);
      g.fillStyle = 'rgba(20,20,20,0.9)';
      for (const x of [60, 120, 180]) { g.beginPath(); g.ellipse(x, 64, 9, 60, 0, 0, Math.PI * 2); g.fill(); }
      break;
    }
    case 'neon': {
      const gr = g.createLinearGradient(0, 0, 0, 128);
      gr.addColorStop(0, '#1d4fe0'); gr.addColorStop(0.42, '#2a6bff');
      gr.addColorStop(0.5, '#7ff5ff'); gr.addColorStop(0.58, '#ff2a2a'); gr.addColorStop(1, '#c81616');
      g.fillStyle = gr; g.fillRect(0, 0, 256, 128);
      break;
    }
    case 'clown': {
      const gr = g.createLinearGradient(0, 0, 0, 128);
      gr.addColorStop(0, '#ff8a2a'); gr.addColorStop(1, '#e8600c');
      g.fillStyle = gr; g.fillRect(0, 0, 256, 128);
      for (const x of [40, 130, 205]) {
        g.fillStyle = '#111'; g.fillRect(x - 13, 0, 26, 128);
        g.fillStyle = '#fbfbfb'; g.fillRect(x - 9, 0, 18, 128);
      }
      break;
    }
    case 'tang': {
      const gr = g.createLinearGradient(0, 0, 0, 128);
      gr.addColorStop(0, '#ffe033'); gr.addColorStop(1, '#f0b400');
      g.fillStyle = gr; g.fillRect(0, 0, 256, 128);
      g.fillStyle = '#2350c8';
      g.beginPath(); g.ellipse(128, 40, 70, 16, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#111';
      g.beginPath(); g.ellipse(185, 60, 10, 10, 0, 0, Math.PI * 2); g.fill();
      break;
    }
    default:
      g.fillStyle = '#888888'; g.fillRect(0, 0, 256, 128);
  }
  drawScales(g, 0.08);
  return new THREE.CanvasTexture(cv);
}
 
function makeBumpTexture() {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 128;
  const g = cv.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, 256, 128);
  drawScales(g, 0.6);
  return new THREE.CanvasTexture(cv);
}
 
function makeFinTexture(colorHex) {
  const cv = document.createElement('canvas');
  cv.width = 128; cv.height = 128;
  const g = cv.getContext('2d');
  g.fillStyle = '#' + colorHex.toString(16).padStart(6, '0');
  g.fillRect(0, 0, 128, 128);
  g.strokeStyle = 'rgba(0,0,0,0.2)';
  g.lineWidth = 1.5;
  for (let i = 0; i <= 12; i++) {
    const a = (i / 12 - 0.5) * 1.6;
    g.beginPath();
    g.moveTo(0, 64);
    g.lineTo(128 * Math.cos(a), 64 + 128 * Math.sin(a));
    g.stroke();
  }
  return new THREE.CanvasTexture(cv);
}
 
// ================= объёмные плавники =================
// Плавник — тонкое тело толщиной thick: две поверхности (лицевая и обратная)
// и боковая кромка. Колышется волной вдоль длины.
function buildFin(fn, thick, amp, freq) {
  const segU = 8, segV = 4;
  const cols = segU + 1, rows = segV + 1;
  const N = cols * rows;
  const idx = (i, j) => j * cols + i;
 
  const base = new Float32Array(N * 2);
  const uArr = new Float32Array(N);
  const uvs = new Float32Array(2 * N * 2);
  for (let j = 0; j <= segV; j++) {
    for (let i = 0; i <= segU; i++) {
      const k = idx(i, j);
      const u = i / segU, v = j / segV;
      const [x, y] = fn(u, v);
      base[2 * k] = x; base[2 * k + 1] = y;
      uArr[k] = u;
      uvs[2 * k] = u; uvs[2 * k + 1] = v;
      uvs[2 * (k + N)] = u; uvs[2 * (k + N) + 1] = v;
    }
  }
 
  const index = [];
  for (let j = 0; j < segV; j++) {
    for (let i = 0; i < segU; i++) {
      const a = idx(i, j), b = idx(i + 1, j), c = idx(i, j + 1), d = idx(i + 1, j + 1);
      index.push(a, b, d, a, d, c);                         // лицевая
      index.push(a + N, d + N, b + N, a + N, c + N, d + N); // обратная
    }
  }
  // боковая кромка по периметру
  const perim = [];
  for (let i = 0; i <= segU; i++) perim.push(idx(i, 0));
  for (let j = 1; j <= segV; j++) perim.push(idx(segU, j));
  for (let i = segU - 1; i >= 0; i--) perim.push(idx(i, segV));
  for (let j = segV - 1; j >= 0; j--) perim.push(idx(0, j));
  for (let k = 0; k < perim.length - 1; k++) {
    const p = perim[k], q = perim[k + 1];
    index.push(p, q, q + N, p, q + N, p + N);
  }
 
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(2 * N * 3), 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(index);
 
  const fin = { geo, base, uArr, N, thick, amp, freq, phase: Math.random() * 6.28 };
  updateFin(fin);
  return fin;
}
 
function updateFin(f) {
  const p = f.geo.attributes.position;
  const N = f.N;
  for (let k = 0; k < N; k++) {
    const u = f.uArr[k];
    const x = f.base[2 * k], y = f.base[2 * k + 1];
    const w = Math.sin(time * f.freq + u * 4 + f.phase) * f.amp * u;
    p.setXYZ(k, x, y, w + f.thick / 2);
    p.setXYZ(k + N, x, y, w - f.thick / 2);
  }
  p.needsUpdate = true;
  f.geo.computeVertexNormals();
}
 
const SHAPES = {
  dorsal: (L, H) => (u, v) => [(u - 0.5) * L * (1 - 0.6 * v), v * H],
  anal:   (L, H) => (u, v) => [(u - 0.5) * L * (1 - 0.6 * v), -v * H],
  fork:   (L, H) => (u, v) => [-u * L + 0.3 * L * u * (1 - Math.abs(2 * v - 1)), (v - 0.5) * H * u],
  fan:    (L, H) => (u, v) => [-u * L, (v - 0.5) * H * u * 1.3],
  pect:   (L, H) => (u, v) => [-u * L, (v - 0.5) * H * (1 - 0.5 * u)],
};
 
// тело с сужением к хвосту
function buildBody() {
  const geo = new THREE.SphereGeometry(0.3, 32, 24);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const t = x / 0.3;
    const k = t < 0 ? 1 - 0.65 * Math.pow(-t, 1.6) : 1 - 0.06 * t * t;
    p.setXYZ(i, x, y * k, z * k);
  }
  geo.computeVertexNormals();
  return { geo, base: Float32Array.from(p.array) };
}
function updateBody(f) {
  const p = f.body.geo.attributes.position;
  const b = f.body.base;
  for (let i = 0; i < p.count; i++) {
    const x = b[i * 3], y = b[i * 3 + 1], z = b[i * 3 + 2];
    const tailFactor = Math.min(1, Math.max(0, -x / 0.3));
    const wave = Math.sin(time * f.beatFreq - x * 7 + f.phase) * 0.05 * tailFactor * tailFactor;
    p.setXYZ(i, x, y, z + wave);
  }
  p.needsUpdate = true;
  f.body.geo.computeVertexNormals();
}
 
// ================= виды рыб =================
const SPECIES = [

function makePanel(w, h, r, thick, yBottom, mat) {
  const bev = 0.003;
  const geo = new THREE.ExtrudeGeometry(roundedRectShape(w, h, r), {
    depth: thick - 2 * bev,
    bevelEnabled: true,
    bevelThickness: bev,
    bevelSize: bev,
    bevelSegments: 3,
    curveSegments: 12,
  });
  geo.center();
  geo.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, [mat, mat]);
  m.position.y = yBottom + thick / 2;
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
 
// строчка по периметру: маленькие нитки (InstancedMesh)
function addStitches(parent, w, h, yTop) {
  const geo = new THREE.BoxGeometry(0.018, 0.002, 0.004);
  const mat = new THREE.MeshStandardMaterial({ color: 0xd9b86a, roughness: 0.6 });
  const inset = 0.035;
  const hw = w / 2 - inset, hh = h / 2 - inset;
  const step = 0.03;
  const pts = [];
  for (let x = -hw; x <= hw; x += step) { pts.push([x, hh, 0]); pts.push([x, -hh, 0]); }
  for (let z = -hh; z <= hh; z += step) { pts.push([hw, z, Math.PI / 2]); pts.push([-hw, z, Math.PI / 2]); }
  const inst = new THREE.InstancedMesh(geo, mat, pts.length);
  const dummy = new THREE.Object3D();
  pts.forEach(([x, z, a], i) => {
    dummy.position.set(x, yTop + 0.001, z);
    dummy.rotation.set(0, a, 0);
    dummy.updateMatrix();
    inst.setMatrixAt(i, dummy.matrix);
  });
  inst.instanceMatrix.needsUpdate = true;
  parent.add(inst);
}

// скруглённый прямоугольник (для корпуса и экрана)
function roundedRectShape(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
 
function rrPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// iPhone 15 Pro Max: 159.9 x 76.7 x 8.25 мм (1 единица = 10 см)
function makePhone() {
  const g = new THREE.Group();
  const W = 0.767, L = 1.599, T = 0.0825, R = 0.06, BEV = 0.006;
 
  // корпус: скруглённые края через экструзию с фаской
  const bodyGeo = new THREE.ExtrudeGeometry(roundedRectShape(W, L, R), {
    depth: T - 2 * BEV,
    bevelEnabled: true,
    bevelThickness: BEV,
    bevelSize: 0.005,
    bevelSegments: 5,
    curveSegments: 16,
  });
  bodyGeo.center();
  bodyGeo.rotateX(-Math.PI / 2);   // экструзия смотрит вверх
 
  const titanium = new THREE.MeshStandardMaterial({ color: 0xb9b6ae, metalness: 0.9, roughness: 0.28 });
  const backGlass = new THREE.MeshPhysicalMaterial({ color: 0xa9a49b, metalness: 0.2, roughness: 0.22, clearcoat: 0.6, clearcoatRoughness: 0.2 });
  const body = new THREE.Mesh(bodyGeo, [backGlass, titanium]);   // группа 0 — грани, 1 — боковины
  body.castShadow = true;
  body.receiveShadow = true;
  g.add(body);
 
  // чёрная рамка дисплея
  const bezel = new THREE.Mesh(
    new THREE.ShapeGeometry(roundedRectShape(W - 0.018, L - 0.018, R - 0.006), 8),
    new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.15 })
  );
  bezel.geometry.rotateX(-Math.PI / 2);
  bezel.position.y = T / 2 + 0.0005;
  g.add(bezel);
 
  // экран с текстурой
  const dW = W - 0.03, dL = L - 0.03, dR = R - 0.012;
  const dGeo = new THREE.ShapeGeometry(roundedRectShape(dW, dL, dR), 8);
  dGeo.rotateX(-Math.PI / 2);
  const uv = dGeo.attributes.uv, pos = dGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    uv.setXY(i, (x + dW / 2) / dW, (-z + dL / 2) / dL);
  }
  const screenMat = new THREE.MeshStandardMaterial({
    map: makeIPhoneScreenTexture(), roughness: 0.12, metalness: 0,
    emissive: 0x202030, emissiveIntensity: 0.25,
  });
  const screen = new THREE.Mesh(dGeo, screenMat);
  screen.position.y = T / 2 + 0.0015;
  g.add(screen);
 
  // боковые кнопки: action и громкость слева, питание справа
  const btn = (w, h, d, x, z) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), titanium);
    m.position.set(x, 0, z);
    m.castShadow = true;
    g.add(m);
  };
  btn(0.008, 0.02, 0.03, -W / 2 - 0.003, -0.6);    // action
  btn(0.008, 0.07, 0.03, -W / 2 - 0.003, -0.45);   // громкость +
  btn(0.008, 0.07, 0.03, -W / 2 - 0.003, -0.32);   // громкость −
  btn(0.008, 0.1, 0.03, W / 2 + 0.003, -0.42);     // питание
 
  g.position.set(3.0, T / 2, -0.9);
  g.rotation.y = 0.2;
  return g;
}

function makeRose(color) {
  const g = new THREE.Group();
  const petalMat = new THREE.MeshStandardMaterial({ color, roughness: 0.5, side: THREE.DoubleSide });
  for (let layer = 0; layer < 3; layer++) {
    const count = 5 + layer;
    for (let p = 0; p < count; p++) {
      const a = (p / count) * Math.PI * 2 + layer * 0.5;
      const petal = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), petalMat);
      petal.scale.set(1.2, 0.6, 1.0);
      petal.position.set(Math.cos(a) * (0.02 + layer * 0.03), 0.02 * layer, Math.sin(a) * (0.02 + layer * 0.03));
      petal.rotation.y = -a;
      g.add(petal);
    }
  }
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), new THREE.MeshStandardMaterial({ color: new THREE.Color(color).multiplyScalar(0.6), roughness: 0.6 }));
  core.position.y = 0.05;
  g.add(core);
  return g;
}
 
function makeDaisy() {

}
 
function makeVase() {
  const g = new THREE.Group();
  const profile = [
    new THREE.Vector2(0.0, 0), new THREE.Vector2(0.36, 0), new THREE.Vector2(0.46, 0.35),
    new THREE.Vector2(0.44, 0.7), new THREE.Vector2(0.28, 1.05), new THREE.Vector2(0.16, 1.25),

  ];
  const ceramic = new THREE.MeshPhysicalMaterial({ color: 0x2f6fa8, roughness: 0.2, clearcoat: 0.8, clearcoatRoughness: 0.1 });
  const vaseMesh = new THREE.Mesh(new THREE.LatheGeometry(profile, 40), ceramic);
  vaseMesh.castShadow = true;
  vaseMesh.receiveShadow = true;
  g.add(vaseMesh);
 
  const water = new THREE.Mesh(
    new THREE.CylinderGeometry(0.2, 0.2, 0.02, 24),
    new THREE.MeshStandardMaterial({ color: 0x3a8fb0, transparent: true, opacity: 0.6, roughness: 0.1 })
  );
  water.position.y = 1.2;
  g.add(water);
 
  const stemMat = new THREE.MeshStandardMaterial({ color: 0x3f8f3f, roughness: 0.7 });
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.6, side: THREE.DoubleSide });
  const heads = [
    { type: 'rose', color: 0xd7263d, x: 0.25, y: 2.25, z: 0.1 },
    { type: 'daisy', x: -0.2, y: 2.05, z: 0.2 },
    { type: 'rose', color: 0xf27ba7, x: 0.05, y: 2.5, z: -0.2 },
    { type: 'daisy', x: -0.35, y: 2.3, z: -0.25 },
    { type: 'rose', color: 0xffa94d, x: 0.35, y: 2.0, z: -0.1 },
  ];
  for (const h of heads) {
    const start = new THREE.Vector3(rnd(-0.05, 0.05), 1.1, rnd(-0.05, 0.05));
    const end = new THREE.Vector3(h.x, h.y - 0.05, h.z);
    const mid = new THREE.Vector3((start.x + end.x) / 2, (start.y + end.y) / 2 + 0.1, (start.z + end.z) / 2);
    const curve = new THREE.CatmullRomCurve3([start, mid, end]);
    g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.012, 6, false), stemMat));
 
    const head = h.type === 'rose' ? makeRose(h.color) : makeDaisy();
    head.position.copy(end);
    head.rotation.y = rnd(0, Math.PI * 2);
    g.add(head);
 
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 6), leafMat);
    leaf.scale.set(1.6, 0.08, 0.6);
    const lp = mid.clone();
    leaf.position.copy(lp);
    leaf.rotation.set(rnd(-0.4, 0.4), rnd(0, Math.PI * 2), rnd(-0.5, 0.5));
    g.add(leaf);
  }
 
  g.position.set(-2.9, 0, -0.9);
  return g;
}

const tmpSep = new THREE.Vector3(), tmpAli = new THREE.Vector3(), tmpCoh = new THREE.Vector3();
const tmpDiff = new THREE.Vector3(), tmpDesired = new THREE.Vector3(), tmpSteer = new THREE.Vector3();
 
function updateFishes(dt) {
  for (const f of fishes) {
    let nearestFood = null, minD = 1.8;
    for (const fd of foods) {
      const d = fd.mesh.position.distanceTo(f.pos);
      if (d < minD) { minD = d; nearestFood = fd; }
    }
    if (nearestFood) {
      f.target.copy(nearestFood.mesh.position);
      f.hasTarget = true;
      if (minD < 0.2) {
        tank.remove(nearestFood.mesh);
        foods.splice(foods.indexOf(nearestFood), 1);
        f.eatT = 0.5;
      }
    } else if (!f.hasTarget || f.pos.distanceTo(f.target) < 0.35 || Math.random() < 0.003) {
      pickWanderTarget(f);
    }
 
    tmpSep.set(0, 0, 0); tmpAli.set(0, 0, 0); tmpCoh.set(0, 0, 0);
    let n = 0;
    for (const g of fishes) {
      if (g === f) continue;
      tmpDiff.subVectors(f.pos, g.pos);
      const d = tmpDiff.length();
      if (d < 1.5) {
        tmpAli.add(g.vel);
        tmpCoh.add(g.pos);
        n++;
        if (d < 0.5 && d > 0.0001) tmpSep.addScaledVector(tmpDiff, (0.5 - d) / d * 1.5);
      }
    }
    tmpSteer.set(0, 0, 0).add(tmpSep).multiplyScalar(3);
    if (n > 0) {
      tmpAli.divideScalar(n).sub(f.vel);
      tmpCoh.divideScalar(n).sub(f.pos);
      tmpSteer.addScaledVector(tmpAli, 0.8 * f.school);
      tmpSteer.addScaledVector(tmpCoh, 0.3 * f.school);
    }
 
    if (f.hasTarget) {
      tmpDesired.subVectors(f.target, f.pos);
      if (tmpDesired.lengthSq() > 1e-6) tmpDesired.normalize();
      const boost = f.burstT > 0 ? 1.8 : 1.0;
      const want = f.baseSpeed * boost * (f.eatT > 0 ? 0.6 : 1.0);
      tmpDesired.multiplyScalar(want);
      tmpSteer.addScaledVector(tmpDesired.sub(f.vel), 1.0);
    }
 
    if (f.pos.x > BOUNDS.x - 0.25) tmpSteer.x -= 2;
    if (f.pos.x < -BOUNDS.x + 0.25) tmpSteer.x += 2;
    if (f.pos.y > BOUNDS.yMax - 0.15) tmpSteer.y -= 2;
    if (f.pos.y < BOUNDS.yMin + 0.15) tmpSteer.y += 2;
    if (f.pos.z > BOUNDS.z - 0.2) tmpSteer.z -= 2;
    if (f.pos.z < -BOUNDS.z + 0.2) tmpSteer.z += 2;
 
    f.vel.addScaledVector(tmpSteer, dt * 2.5);
 
    f.burstT -= dt;
    f.eatT -= dt;
    if (f.burstT <= 0 && Math.random() < dt * 0.08) f.burstT = 0.6;
    const sp = f.vel.length();
    const maxSp = f.baseSpeed * (f.burstT > 0 ? 1.8 : 1.0);
    const minSp = f.baseSpeed * 0.5;
    if (sp > maxSp) f.vel.multiplyScalar(maxSp / sp);
    else if (sp < minSp && sp > 1e-4) f.vel.multiplyScalar(minSp / sp);
 
    f.pos.addScaledVector(f.vel, dt);
    f.pos.x = Math.min(BOUNDS.x, Math.max(-BOUNDS.x, f.pos.x));
    f.pos.y = Math.min(BOUNDS.yMax, Math.max(BOUNDS.yMin, f.pos.y));
    f.pos.z = Math.min(BOUNDS.z, Math.max(-BOUNDS.z, f.pos.z));
  }
}
 
function animateFishVisuals() {
  for (const f of fishes) {
    const vx = f.vel.x, vy = f.vel.y, vz = f.vel.z;
    const hSp = Math.sqrt(vx * vx + vz * vz);
    const speedNorm = f.vel.length() / f.baseSpeed;
 
    f.beatFreq = 6 + speedNorm * 5;
 
    f.group.position.copy(f.pos);
    f.group.position.y += Math.sin(time * 1.5 + f.phase) * 0.01;
    f.group.rotation.y = Math.atan2(-vz, vx);
    f.group.rotation.z = Math.atan2(vy, Math.max(hSp, 0.0001)) * 0.8;
    f.group.rotation.x = Math.sin(time * 2 + f.phase) * 0.03;
 
    updateBody(f);
 
    f.tailPivot.rotation.y = Math.sin(time * f.beatFreq + f.phase - 0.3 * 7) * 0.25;
 
    const flap = f.burstT > 0 ? 10 : 4;
    f.pectorals.forEach((p, i) => { p.rotation.z = Math.sin(time * flap + f.phase + i * 3) * 0.3; });
 
    for (const fin of f.fins) updateFin(fin);
 
    f.mouth.scale.y = f.eatT > 0 ? 2.2 : 0.8;
    f.mouth.scale.x = f.eatT > 0 ? 1.4 : 1.0;
  }
}

const clock = new THREE.Clock();
 
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;
  causticMat.uniforms.uTime.value = time;
 
  for (let i = foods.length - 1; i >= 0; i--) {
    const fd = foods[i];
    fd.vy -= dt * 0.4;
    fd.mesh.position.y += fd.vy * dt;
    if (fd.mesh.position.y < 0.35) {
      tank.remove(fd.mesh);
      foods.splice(i, 1);
    }
  }
 
  updateFishes(dt);
 
  for (const f of fishes) {
    const sp = f.vel.length();
    f.wakeTimer -= dt;
    if (wavesOn && sp > 0.3 && f.wakeTimer <= 0) {
      addRipple(f.pos.x, f.pos.z, 0.012 * sp * (0.5 + f.pos.y / SURF_Y));
      f.wakeTimer = 0.5 + Math.random() * 0.3;
    }
  }
 
  animateFishVisuals();
 
  bubbleTimer += dt;
  if (bubbleTimer > 0.35) {
    bubbleTimer = 0;
    const r = 0.02 + Math.random() * 0.03;
    const m = new THREE.Mesh(bubbleGeo, bubbleMat);
    m.scale.setScalar(r);
    m.position.copy(BUBBLER);
    tank.add(m);
    bubbles.push({ mesh: m, speed: 0.35 + Math.random() * 0.3, wob: Math.random() * 6 });
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.mesh.position.y += b.speed * dt;
    b.mesh.position.x += Math.sin(time * 3 + b.wob) * 0.002;
    if (b.mesh.position.y > SURF_Y - 0.02) {
      addRipple(b.mesh.position.x, b.mesh.position.z, 0.008);
      tank.remove(b.mesh);
      bubbles.splice(i, 1);
    }
  }
 
  for (let i = 0; i < plants.length; i++) {
    plants[i].rotation.z = Math.sin(time * 0.9 + i) * 0.05;
    plants[i].rotation.x = Math.cos(time * 0.7 + i * 1.3) * 0.04;
  }
 
  for (let i = ripples.length - 1; i >= 0; i--) {
    if (time - ripples[i].t0 > 6) ripples.splice(i, 1);
  }
 
  // телефон приподнимается при перетаскивании и плавно поворачивается
  const phoneTargetY = phoneDrag.active ? PHONE_BASE_Y + 0.15 : PHONE_BASE_Y;
  phoneObj.position.y += (phoneTargetY - phoneObj.position.y) * Math.min(1, dt * 12);
  phoneObj.rotation.y += (phoneRotTarget - phoneObj.rotation.y) * Math.min(1, dt * 10);
 
  updateSurface();
  tankLight.intensity = 1.0 + Math.sin(time * 1.5) * 0.1;
 
  renderer.render(scene, camera);
}
 
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
 
animate();
</script>
</body>
</html>
